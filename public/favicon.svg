<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#07080f"/>
  <!-- Orbit ellipse, partial arc -->
  <path d="M 8 38 A 26 10 -20 1 1 56 26" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cube face grid -->
  <rect x="19" y="19" width="26" height="26" rx="2.5" fill="#0d1117" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="27.7" y1="19" x2="27.7" y2="45" stroke="#f59e0b" stroke-width="0.9" opacity="0.55"/>
  <line x1="36.3" y1="19" x2="36.3" y2="45" stroke="#f59e0b" stroke-width="0.9" opacity="0.55"/>
  <line x1="19" y1="27.7" x2="45" y2="27.7" stroke="#f59e0b" stroke-width="0.9" opacity="0.55"/>
  <line x1="19" y1="36.3" x2="45" y2="36.3" stroke="#f59e0b" stroke-width="0.9" opacity="0.55"/>
  <!-- Colored corner stickers to hint at a real Rubik's cube -->
  <rect x="20.5" y="20.5" width="6" height="6" rx="1" fill="#E74C3C" opacity="0.9"/>
  <rect x="37.5" y="20.5" width="6" height="6" rx="1" fill="#3498DB" opacity="0.9"/>
  <rect x="20.5" y="37.5" width="6" height="6" rx="1" fill="#2ECC71" opacity="0.9"/>
  <rect x="37.5" y="37.5" width="6" height="6" rx="1" fill="#F1C40F" opacity="0.9"/>
  <!-- Orbit travelling dot -->
  <circle cx="55" cy="26" r="3" fill="#f59e0b"/>
</svg>
